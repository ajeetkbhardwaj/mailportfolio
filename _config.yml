# portproxy — standalone single-page portfolio (Jekyll)
# Preview:  cd portproxy && jekyll serve
# Deploy:   push this folder to your GitHub Pages repo; set baseurl below
#           to "/portproxy" when hosted at https://ajeetkbhardwaj.github.io/mailportfolio/

title: "Ajeet Kumar"
name: "Ajeet Kumar"
description: "Applied mathematician specializing in full-stack machine learning and data science"
email: "ajeetkamla7897@gmail.com"
avatar: "/images/Profile2.png"

url: "https://ajeetkbhardwaj.github.io"
baseurl: "/mailportfolio" # "" when deployed at the site root, "/portproxy" when hosted in the portproxy subfolder

# Collections — write your content as markdown here and it is rendered below.
collections:
  portfolio:
    output: false
  publications:
    output: false

exclude:
  - _posts

defaults:
  - scope:
      path: "_portfolio"
    values:
      layout: single
  - scope:
      path: "_publications"
    values:
      layout: single

# Conversion
markdown: kramdown
highlighter: rouge
encoding: "utf-8"
future: true

# Outputting
permalink: pretty
