{% include head.html %}
<body>

{% include nav.html %}

<main>
  <section class="page">
    <div class="container prose">
      <h1>{{ page.title }}</h1>
      <div class="meta">
        {% if page.venue %}{{ page.venue }} &middot; {% endif %}
        {% if page.date %}{{ page.date | date: "%B %Y" }}{% endif %}
        {% if page.url %}<br><a href="{{ page.url }}" target="_blank" rel="noopener">Project link &rarr;</a>{% endif %}
      </div>
      {{ content }}
    </div>
  </section>
</main>

{% include footer.html %}

</body>
</html>
